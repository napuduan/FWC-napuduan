<<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ratchapruek Portfolio</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #222;

            /* ===== BACKGROUND ===== */
            background-image: url("https://cdn.phototourl.com/free/2026-09-17-b2b02931-80cf-4474-9976-a3bbb967ed2d.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* ===== NAVBAR ===== */

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;

            background: rgba(0, 0, 0, 0.75);

            display: flex;
            justify-content: center;
            gap: 35px;

            padding: 18px;

            z-index: 1000;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
        }

        nav a:hover {
            color: #ddd;
        }

        /* ===== SECTION ===== */

        section {
            min-height: 100vh;

            padding: 110px 20px 60px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;
        }

        /* ===== CONTENT BOX ===== */

        .content {
            width: 90%;
            max-width: 900px;

            background: rgba(255, 255, 255, 0.85);

            border-radius: 25px;

            padding: 40px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
        }

        /* ===== PROFILE PHOTO ===== */

        .profile {
            width: 180px;
            height: 180px;

            border-radius: 50%;

            object-fit: cover;

            border: 5px solid white;

            margin-bottom: 20px;
        }

        h1 {
            font-size: 45px;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            line-height: 1.7;
        }

        /* ===== SHOWCASE ===== */

        .cards {
            display: flex;
            justify-content: center;

            gap: 20px;

            flex-wrap: wrap;

            margin-top: 25px;
        }

        .card {
            width: 220px;

            background: rgba(255, 255, 255, 0.9);

            padding: 25px;

            border-radius: 15px;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .card h3 {
            margin-top: 0;
        }

        /* ===== CONTACT ===== */

        .contact a {
            display: inline-block;

            margin: 8px;

            padding: 12px 20px;

            background: #222;

            color: white;

            text-decoration: none;

            border-radius: 10px;
        }

        .contact a:hover {
            background: #555;
        }

        /* ===== BACK HOME ===== */

        .back {
            margin-top: 30px;

            color: #222;

            font-weight: bold;

            text-decoration: none;
        }

        /* ===== MOBILE ===== */

        @media (max-width: 700px) {

            nav {
                gap: 15px;
                padding: 15px 5px;
            }

            nav a {
                font-size: 14px;
            }

            .content {
                padding: 25px 15px;
            }

            h1 {
                font-size: 35px;
            }

            h2 {
                font-size: 27px;
            }

            p {
                font-size: 16px;
            }

            .profile {
                width: 140px;
                height: 140px;
            }

            .card {
                width: 90%;
            }
        }

    </style>
</head>


<body>

    <!-- ===== NAVBAR ===== -->

    <nav>
        <a href="#about">About</a>
        <a href="#showcase">Showcase</a>
        <a href="#contact">Contact</a>
    </nav>


    <!-- ===== ABOUT ===== -->

<section id="about">

    <div class="content">

        <img
            src="https://cdn.phototourl.com/free/2026-09-17-34ff8448-b9fa-4a74-a454-ae52a5ee8695.jpg"
            alt="Ratchapruek Photo"
            class="profile"
        >

        <h1>Ratchapruek</h1>

        <p>
            ชื่อ: ราชพฤกษ์ คชา
           
        </p>

        <p>
            สถาบัน: สถาบันเทคโนโลยีพระจอมเกล้าเจ้าคุณทหารลาดกระบัง
        </p>

        <p>
            คณะ: บริหารธุรกิจ สาขาเศรษฐศาสตร์ธุรกิจและการจัดการ
        </p>
		

    </div>

</section>


    <section id="showcase">

    <div class="content">

        <h2>ความสามารถส่วนตัว</h2>

        <p>
            เป็นส่วนหนึ่งของบ้านพิธีกรคณะบริหารธุรกิจ
        </p>

		

</div>

</section>


    <!-- ===== ติดต่อ ===== -->

<section id="contact">

    <div class="content contact">

        <h2>CONTACT</h2>

        <p>
            ช่องทางติดต่อ
        </p>

        <!-- Instagram -->

    <div class=”social-links“>
        <a href=”https://www.instagram.com/ratcha_kc?stkn=MXN0d2J1eXB6ajUwNw==“>Instagram</a>
      </div>

</section>

</body>

</html>
