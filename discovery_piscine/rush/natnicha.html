    <style>

        body {
            margin: 0;

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;

            background: rgba(0, 0, 0, 0.75);

            display: flex;
            justify-content: center;
            gap: 35px;

        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
        }

        nav a:hover {
            color: #ddd;
        }

        /* ===== SECTION ===== */

        section {
            min-height: 100vh;

            padding: 110px 20px 60px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;
        }

        /* ===== CONTENT BOX ===== */

        .content {
            width: 90%;
            max-width: 900px;

            background: rgba(255, 255, 255, 0.85);

            border-radius: 25px;

            padding: 40px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
        }

        /* ===== PROFILE PHOTO ===== */

        .profile {
            width: 180px;
            height: 180px;

            border-radius: 50%;

            object-fit: cover;

            border: 5px solid white;

            margin-bottom: 20px;
        }

        h1 {
            font-size: 45px;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            line-height: 1.7;
        }

        /* ===== SHOWCASE ===== */

        .cards {
            display: flex;
            justify-content: center;

            gap: 20px;

            flex-wrap: wrap;

            margin-top: 25px;
        }

        .card {
            width: 220px;

            background: rgba(255, 255, 255, 0.9);

            padding: 25px;

            border-radius: 15px;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .card h3 {
            margin-top: 0;
        }

        /* ===== CONTACT ===== */

        .contact a {
            display: inline-block;

            margin: 8px;

            padding: 12px 20px;

            background: #222;

            color: white;

            text-decoration: none;

            border-radius: 10px;
        }

        .contact a:hover {
            background: #555;
        }

        /* ===== BACK HOME ===== */

        /* ===== ปุ่มกลับหน้าหลัก ===== */
.back {
    display: inline-block;

    padding: 12px 25px;

    color: white;

    border-radius: 12px;

    text-decoration: none;
    font-size: 18px;
    font-weight: bold;

    transition: 0.3s;
}

.back:hover {
    background: #000;
    transform: translateY(-2px);
}

.back {

    border-radius: 12px;

    text-decoration: none;

    transition: 0.3s;

.back:hover {

    color: #222;
}

        /* ===== MOBILE ===== */

        @media (max-width: 700px) {

            nav {
                gap: 15px;
                padding: 15px 5px;
            }

            }

            .content {
                padding: 25px 15px;
            }

            h1 {

            }

            h2 {
                font-size: 27px;
            }

            p {
                font-size: 16px;
            }

            .profile {
                width: 140px;
                height: 140px;
            }

            .card {
                width: 90%;
            }
