<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;
            color: #222;

            /* BACKGROUND */
            background-image: url("https://cdn.phototourl.com/free/2026-09-17-b2b02931-80cf-4474-9976-a3bbb967ed2d.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        header {
            text-align: center;
            padding: 60px 20px 30px;
            color: white;

            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        header h1 {
            font-size: 45px;
            margin: 0 0 10px;
        }

        header p {
            font-size: 20px;
            margin: 0;
        }

        .container {
            min-height: 70vh;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 40px;
            padding: 40px 20px;

            flex-wrap: wrap;
        }

        .person {
            width: 320px;
            height: 220px;

            background: rgba(255, 255, 255, 0.85);

            border: 2px solid white;
            border-radius: 20px;

            display: flex;
            justify-content: center;
            align-items: center;

            text-decoration: none;
            color: #222;

            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);

            transition: 0.3s;
        }

        .person:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.95);
        }

        .person h2 {
            font-size: 30px;
        }

        @media (max-width: 700px) {

            header h1 {
                font-size: 35px;
            }

            header p {
                font-size: 17px;
            }

            .container {
                gap: 25px;
            }

            .person {
                width: 90%;
                max-width: 320px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Our Portfolio</h1>
        <p>Welcome to our mini portfolio website</p>
    </header>

    <div class="container">

        <a href="ratchapruek.html" class="person">
            <h2>Ratchapruek</h2>
        </a>

        <a href="natnicha.html" class="person">
            <h2>Natnicha</h2>
        </a>

    </div>

</body>
</html>
