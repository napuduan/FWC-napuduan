    <title>User Profile Card</title>
    <link rel="stylesheet" href="card.css" />

  <body>
    <header>

        <tr>
          <td class="description">Curious, focused, Uma</td>
        </tr>
        <tr>
          <td class="socials">
            <a href="#"><img src="https://img.magnific.com/free-vector/new-2023-twitter-logo-x-icon-design_1017-45418.jpg?semt=ais_hybrid&w=740&q=80" alt="Twitter" /></a>
            <a href="#"><img src="https://cdn.phototourl.com/free/2026-09-16-d46f500f-113e-4964-a280-11166d6a1eae.jpg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original" alt="Facebook" /></a>
            <a href="#"><img src="https://images.icon-icons.com/1488/PNG/512/5295-youtube-i_102568.png" alt="Youtube" /></a>
          </td>
        </tr>
      </table>

      <a class="contact-btn" href="https://www.instagram.com/pxkkxz_pddz?stkn=MTFzZDNzeTJkeGJ6Zg%3D%3D&utm_source=qr" target="_blank">Contact</a>
    </div>
